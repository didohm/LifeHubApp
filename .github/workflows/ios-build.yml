name: iOS Build (IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "ios/**"
      - "capacitor.config.ts"
      - "vite.config.capacitor.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-build.yml"

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4 (required for firebase-ios-sdk >=12.7 / Swift tools 6.1)
        run: |
          echo "Available Xcodes:"
          ls -1 /Applications | grep -E "Xcode"
          # Prefer 16.4, fallback to 16.3, 16, then latest
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          fi
          echo "Selected Xcode:"
          xcodebuild -version
          swift --version
          # fail fast if Swift tools <6.1
          swift --version | grep -q "6\." || echo "::warning::Swift 6.x not detected - firebase-ios-sdk 12.x requires Xcode 16.3+ (Swift 6.1)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (Capacitor SPA)
        run: npm run build:capacitor

      - name: Sync Capacitor iOS (add platform if missing)
        run: |
          if [ ! -d "ios/App" ]; then
            echo "iOS platform not found - adding via Capacitor"
            npx cap add ios
          fi
          npx cap sync ios

      - name: Setup GoogleService-Info.plist (Firebase iOS)
        run: |
          mkdir -p ios/App/App
          if [ -f "GoogleService-Info.plist" ]; then
            echo "Found GoogleService-Info.plist at repo root - copying to ios/App/App/"
            cp GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          elif [ -n "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" ]; then
            echo "Decoding GoogleService-Info.plist from GitHub Secret"
            echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > ios/App/App/GoogleService-Info.plist
          else
            echo "::warning::GoogleService-Info.plist not found at root and secret GOOGLE_SERVICE_INFO_PLIST not set. Firebase iOS features may fail. To fix: base64 -w 0 GoogleService-Info.plist | gh secret set GOOGLE_SERVICE_INFO_PLIST"
          fi
          ls -l ios/App/App/GoogleService-Info.plist || echo "No plist - build will continue without Firebase config"

      - name: Install CocoaPods (if Podfile exists)
        working-directory: ios/App
        run: |
          if [ -f "Podfile" ]; then
            pod install
          else
            echo "No Podfile found - using SPM (Capacitor 8+), skipping pod install"
          fi

      - name: Build unsigned IPA (for testing / sideloading)
        working-directory: ios/App
        run: |
          # Capacitor 8+ uses SPM (no Podfile) -> no App.xcworkspace, use App.xcodeproj
          # Resolve SPM deps first
          if [ -d "App.xcworkspace" ]; then
            XCODE_FLAG="-workspace App.xcworkspace"
          else
            echo "No App.xcworkspace found, using App.xcodeproj (SPM)"
            XCODE_FLAG="-project App.xcodeproj"
            # Resolve Swift Package dependencies (Capacitor plugins)
            xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App || echo "resolvePackageDependencies failed or no packages"
          fi

          echo "Building with $XCODE_FLAG"
          xcodebuild $XCODE_FLAG \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p build/ipa/Payload
          cp -r build/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
          cd build/ipa
          zip -r LifeHub-unsigned.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeHub-unsigned-ipa
          path: ios/App/build/ipa/LifeHub-unsigned.ipa
          retention-days: 7

      # --- For App Store / TestFlight (requires Apple Developer certificates) ---
      # 1. Add secrets to GitHub: APPLE_CERTIFICATE (base64 .p12), APPLE_PROVISIONING_PROFILE (base64 .mobileprovision),
      #    CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD
      # 2. Uncomment below and comment out the unsigned build above
